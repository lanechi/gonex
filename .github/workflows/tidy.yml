name: sync-module-metadata

on:
  push:
    branches: [chore/production-hardening]

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/production-hardening
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.26.7
          cache: false
      - name: Tidy all modules
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          for module in gx examples/basic examples/demo examples/quick-demo benchmarks/gx contrib/gormlog contrib/redislog; do
            (cd "$module" && go mod tidy)
          done
      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- 'go.mod' 'go.sum' 'gx/go.mod' 'gx/go.sum' 'examples/basic/go.mod' 'examples/basic/go.sum' 'examples/demo/go.mod' 'examples/demo/go.sum' 'examples/quick-demo/go.mod' 'examples/quick-demo/go.sum' 'benchmarks/gx/go.mod' 'benchmarks/gx/go.sum' 'contrib/gormlog/go.mod' 'contrib/gormlog/go.sum' 'contrib/redislog/go.mod' 'contrib/redislog/go.sum'
          git commit -m 'deps: synchronize module metadata'
          git push origin HEAD:chore/production-hardening
