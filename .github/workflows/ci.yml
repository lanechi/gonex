name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
          cache: true
      - run: go mod tidy -diff
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck -checks=all,-U1000 ./...
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: git diff --check

  gx:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
          cache-dependency-path: gx/go.sum
      - run: go mod tidy -diff
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - examples/basic
          - examples/demo
          - examples/quick-demo
          - benchmarks/gx
          - contrib/gormlog
          - contrib/redislog
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
          cache: false
      - run: go mod tidy -diff
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  api-compat:
    name: v1 API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
          cache: true
      - name: Check compatibility with latest stable v1
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git tag --list 'v1.*' --sort=-v:refname | grep -E '^v1\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$baseline" ]; then
            echo "No stable v1 tag exists; pre-v1 API cleanup remains intentionally unfrozen."
            exit 0
          fi
          rest="${baseline#v1.}"
          minor="${rest%%.*}"
          proposed="v1.$((minor + 1)).0"
          go install golang.org/x/exp/cmd/gorelease@3d80eb74bc5bc9b889252996f1ad776b9e8e0667
          gorelease -base="$baseline" -version="$proposed"

  portability:
    name: portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.7
          cache: true
      - name: Test core
        run: go test ./...
      - name: Test gx
        working-directory: gx
        run: go test ./...
